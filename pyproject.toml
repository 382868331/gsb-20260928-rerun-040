[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biochem-reaction-lab"
version = "0.1.0"
description = "Offline stochastic and deterministic biochemical reaction experiments"
requires-python = ">=3.11"

[project.scripts]
biochem-lab = "biochem.cli:main"

[tool.setuptools.packages.find]
include = ["biochem*"]

[tool.pytest.ini_options]
addopts = "-q"
